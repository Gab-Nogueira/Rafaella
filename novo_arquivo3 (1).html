<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Poppins',sans-serif;
  height:100vh;
  overflow:hidden;
  background:linear-gradient(135deg,#ff758c,#ff7eb3,#fad0c4);
  color:#fff;
}

.container{
  max-width:420px;
  margin:auto;
  height:100vh;
  padding:20px;
  display:flex;
  flex-direction:column;
  text-align:center;
}

header{
  flex-shrink:0;
}

header img{
  width:160px;
  height:160px;
  border-radius:20px;
  object-fit:cover;
  border:4px solid #fff;
  box-shadow:0 12px 30px rgba(0,0,0,.3);
}

h1{margin:10px 0 5px}

#contador{
  font-weight:600;
  margin-top:5px;
}

/* BOTÃO VIVO */
button{
  margin:25px auto;
  padding:14px 32px;
  border:none;
  border-radius:40px;
  background:#fff;
  color:#ff4f7a;
  font-size:1.05rem;
  font-weight:600;
  cursor:pointer;
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  0%{transform:scale(1); box-shadow:0 0 0 0 rgba(255,255,255,.6)}
  70%{transform:scale(1.08); box-shadow:0 0 0 15px rgba(255,255,255,0)}
  100%{transform:scale(1)}
}

#lista{
  flex:1;
  overflow-y:auto;
  padding-right:8px;
}

.motivo{
  background:rgba(255,255,255,.22);
  margin-bottom:10px;
  padding:12px;
  border-radius:16px;
  animation:fadeUp .6s ease forwards;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}

/* CORAÇÕES */
.coracao{
  position:fixed;
  bottom:-20px;
  font-size:22px;
  animation:subir 3.5s linear forwards;
  pointer-events:none;
}

@keyframes subir{
  from{transform:translateY(0) scale(1);opacity:1}
  to{transform:translateY(-110vh) scale(1.6);opacity:0}
}

/* EXPLOSÃO */
.explosao{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:10;
  font-size:1.8rem;
}
</style>
</head>

let indice=0, intervalo;
const lista=document.getElementById("lista");
const contador=document.getElementById("contador"); 
const btn=document.getElementById("btn");

/* SCROLL SUAVE */
function scrollSuave(){
  const inicio=lista.scrollTop;
  const destino=inicio+65;
  const duracao=1000; // 🔥 MAIS RÁPIDO
  let t0=null;

  function animar(t){
    if(!t0) t0=t;
    const p=Math.min((t-t0)/duracao,1);
    lista.scrollTop=inicio+(destino-inicio)*p;
    if(p<1) requestAnimationFrame(animar);
  }
  requestAnimationFrame(animar);
}

/* MAIS CORAÇÕES */
function soltarCoracoes(qtd=100){
  for(let i=0;i<qtd;i++){
    const c=document.createElement("div");
    c.className="coracao";
    c.innerText="💖";
    c.style.left=Math.random()*100+"vw";
    c.style.fontSize=(18+Math.random()*14)+"px";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),3500);
  }
}

/* EXPLOSÃO FINAL */
function explosaoFinal(){
  const e=document.createElement("div");
  e.className="explosao";
  e.innerHTML="Eu te amo, Rafaella 💖";
  document.body.appendChild(e);

  let boom=setInterval(()=>soltarCoracoes(100),200);
  setTimeout(()=>clearInterval(boom),2500);
}

function mostrar(){
  if(indice>=motivos.length){
    explosaoFinal();
    clearInterval(intervalo);
    return;
  }

  const div=document.createElement("div");
  div.className="motivo";
  div.innerText=(indice+1)+". "+motivos[indice];
  lista.appendChild(div);

  contador.innerText=(indice+1)+" / 200";
  scrollSuave();
  soltarCoracoes(4);

  indice++;
}

btn.onclick=()=>{
  btn.style.display="none";
  intervalo=setInterval(mostrar,1000); // 🔥 mais rápido
};
</script>
